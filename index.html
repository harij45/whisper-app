<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#12002b">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Whisper</title>
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">

        <img src="logo.png" class="logo" alt="Whisper">

        <p class="tagline">Speak freely. Stay unknown.</p>

    </div>

    <p id="siteNotice" class="siteNotice hidden" role="status"></p>

    <div id="home">

        <label for="helpInput" class="srOnly">What's on your mind?</label>
        <textarea id="helpInput" maxlength="500" placeholder="What's on your mind..."></textarea>
        <button id="startRoomBtn" class="startBtn">Start Whisper</button>

        <div class="sectionHeading">
            <h2>Live Rooms</h2>
            <button
                id="toggleRoomSearchBtn"
                class="searchToggleBtn"
                type="button"
                aria-label="Search rooms by code"
                aria-controls="roomSearch"
                aria-expanded="false"
                title="Search rooms"
            >
                <span class="searchGlyph" aria-hidden="true"></span>
            </button>
        </div>
        <div id="roomSearch" class="roomSearch hidden">
            <label for="roomSearchInput" class="srOnly">Room code</label>
            <input
                id="roomSearchInput"
                type="search"
                maxlength="8"
                inputmode="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                placeholder="Enter room code"
            >
            <button id="clearRoomSearchBtn" class="searchClearBtn" type="button">Clear</button>
        </div>
        <p class="privacyNote">No account required · Rooms expire after 24 hours · Protected abuse data expires after 30 days</p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div id="roomsList"></div>
        <nav id="roomPagination" class="pagination hidden" aria-label="Room pages">
            <button id="previousRoomsBtn" class="pageBtn" type="button" aria-label="Previous room page">←</button>
            <span id="roomPageIndicator" class="pageIndicator" aria-live="polite">1 / 1</span>
            <button id="nextRoomsBtn" class="pageBtn" type="button" aria-label="Next room page">→</button>
        </nav>

    </div>

    <div id="chatRoom" class="hidden">
        <div class="chatTopbar">
            <button id="backHomeBtn" class="secondaryBtn">← Back</button>
            <div class="roomActions">
                <button id="reportRoomBtn" class="reportBtn" title="Report room">
                    <img src="report.png" class="reportIcon" alt="">
                    <span>Report</span>
                </button>
                <button id="closeRoomBtn" class="closeBtn">Close Room</button>
            </div>
        </div>

        <h2 id="roomTitle"></h2>

        <div id="chatMessages" role="log" aria-live="polite"></div>
        <p id="chatStatus" class="status" role="status" aria-live="polite"></p>

        <div class="composer">
            <label for="chatInput" class="srOnly">Message</label>
            <input type="text" id="chatInput" maxlength="1000" autocomplete="off" placeholder="Type your whisper...">
            <button id="sendMessageBtn" class="sendBtn">Send</button>
        </div>

    </div>
    
    <div class="cardFooter">
        <a href="feedback.html" class="feedbackBtn">Feedback</a>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
