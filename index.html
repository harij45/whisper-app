<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070013">
    <title>Whisper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">

        <img src="logo.png" class="logo" alt="Whisper">

        <p class="tagline">Speak freely. Stay unknown.</p>

    </div>

    <div id="home">

        <label for="helpInput" class="srOnly">What's on your mind?</label>
        <textarea id="helpInput" maxlength="500" placeholder="What's on your mind..."></textarea>
        <button class="startBtn" onclick="createRoom()">Start Whisper</button>

        <div class="sectionHeading">
            <h2>Live Rooms</h2>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div id="roomsList"></div>

    </div>

    <div id="chatRoom" class="hidden">
        <div class="chatTopbar">
            <button class="secondaryBtn" onclick="goHome()">← Back</button>
            <div class="roomActions">
                <button class="reportBtn" onclick="reportRoom()" title="Report room">
                    <img src="report.png" class="reportIcon" alt="">
                    <span>Report</span>
                </button>
                <button id="closeRoomBtn" onclick="closeRoom()" class="closeBtn">Close Room</button>
            </div>
        </div>

        <h2 id="roomTitle"></h2>

        <div id="chatMessages" role="log" aria-live="polite"></div>
        <p id="chatStatus" class="status" role="status" aria-live="polite"></p>

        <div class="composer">
            <label for="chatInput" class="srOnly">Message</label>
            <input type="text" id="chatInput" maxlength="1000" autocomplete="off" placeholder="Type your whisper...">
            <button class="sendBtn" onclick="sendMessage()">Send</button>
        </div>

    </div>
    
    <div class="cardFooter">
        <a href="feedback.html" class="feedbackBtn">Feedback</a>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
