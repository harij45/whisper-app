<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Whisper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">

        <img src="logo.png" class="logo" alt="Whisper">

        <p class="tagline">Speak freely. Stay unknown.</p>

    </div>

    <div id="home">

        <textarea id="helpInput" placeholder="What's on your mind..."></textarea>
        <button onclick="createRoom()">Start Whisper</button>

        <h2>Live Rooms</h2>
        <p id="status" class="status" role="status"></p>
        <div id="roomsList"></div>

    </div>

    <div id="chatRoom" class="hidden">
        <button id="closeRoomBtn" onclick="closeRoom()" class="closeBtn">Close Room</button>
        
        <button class="reportBtn" onclick="reportRoom()" title="Report">
            <img src="report.png" class="reportIcon" alt="">
        </button>

        <h2 id="roomTitle"></h2>

        <div id="chatMessages"></div>
        <p id="chatStatus" class="status" role="status"></p>

        <input type="text" id="chatInput" placeholder="Type your whisper...">
        <button onclick="sendMessage()">Send</button>

        <button onclick="goHome()">Back</button>

    </div>
    

</div>

<a href="feedback.html" class="feedbackBtn">Feedback</a>
<script src="script.js"></script>

</body>
</html>
