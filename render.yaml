services:
  - type: web
    name: whisper-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: whisper-db
          property: connectionString
      - key: WEB3FORMS_ACCESS_KEY
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: IP_PRIVACY_KEY
        sync: false

databases:
  - name: whisper-db
    plan: free
    databaseName: whisper
    user: whisper
