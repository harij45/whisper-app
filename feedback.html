<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#12002b">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Whisper">
    <title>Feedback - Whisper</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container feedbackPanel">

    <div class="header">
        <img src="logo.png" class="logo" alt="Whisper">
        <p class="tagline">Help us make Whisper better.</p>
    </div>

    <h1>Send Feedback</h1>
    <p class="pageIntro">Share a suggestion or tell us what could work better. Don’t include personal or sensitive information.</p>

    <label for="feedbackInput" class="srOnly">Your feedback</label>
    <textarea id="feedbackInput" maxlength="1000" placeholder="Share your thoughts or suggestions..."></textarea>

    <div id="turnstileWidget" class="turnstileWidget"></div>
    <p id="turnstileStatus" class="turnstileStatus" role="status" aria-live="polite">Loading spam protection…</p>

    <button id="submitFeedbackBtn" class="fullBtn" disabled>Submit Feedback</button>
    <p id="feedbackStatus" class="status" role="status" aria-live="polite"></p>
    <a class="backLink" href="index.html">← Back to Whisper</a>

</div>

<script src="feedback.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=initializeTurnstile&render=explicit" defer></script>

</body>
</html>
